[package]
name = "t3-mcp-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "t3-codex"
path = "src/bin/t3-codex.rs"

[[bin]]
name = "t3-claude"
path = "src/bin/t3-claude.rs"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
tokio = { version = "1.54.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.2", features = ["process"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
